events {
    worker_connections 2048;
}

http {
    upstream app_cluster {
        least_conn; # Load-balances connections to the least busy container
        server app-1:3000 max_fails=3 fail_timeout=10s;
        server app-2:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        # Increase buffer size for large headers
        large_client_header_buffers 4 16k;
        client_max_body_size 50M;

        location / {
            proxy_pass http://app_cluster;
            proxy_http_version 1.1;

            # WebSocket support for GD room & real-time audio
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings to prevent dropped WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
