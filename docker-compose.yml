version: '3.8'

services:
  # Interview Coach App Replica 1
  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview_coach_app_1
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Interview Coach App Replica 2
  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview_coach_app_2
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Nginx Load Balancer with WebSocket & HTTP/2 Support
  nginx-loadbalancer:
    image: nginx:alpine
    container_name: interview_coach_lb
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2
